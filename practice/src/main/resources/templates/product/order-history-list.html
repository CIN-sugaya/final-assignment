<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品発注履歴一覧</title>
</head>
<body>
    <h1>商品発注履歴一覧</h1> <!-- No.1 タイトル -->

    <table border="1">
        <thead>
            <tr>
                <th>商品名</th> <!-- No.2 商品名 -->
                <th>発注数</th> <!-- No.3 発注数 -->
                <th>発注者</th> <!-- No.4 発注者 -->
                <th>合計金額</th> <!-- No.5 合計金額 -->
                <th>店舗名</th> <!-- 追加：No.6 店舗名 -->
                <th>発注日時</th> <!-- No.7 発注日時 -->
            </tr>
        </thead>
        <tbody>
            <tr th:each="orderHistory : ${orderHistories}">
                <td th:text="${orderHistory['productName']}">商品名</td>
                <td th:text="${orderHistory['orderQuantity']}">発注数</td>
                <td th:text="${orderHistory['adminLastName']}">発注者</td>
                <td th:text="${orderHistory['totalAmount']}">合計金額</td>
                <td th:text="${orderHistory['storeName']}">店舗名</td> <!-- 追加：店舗名を表示 -->
                <td th:text="${#temporals.format(orderHistory['createdAt'], 'yyyy/MM/dd HH:mm:ss')}">発注日時</td>
            </tr>
        </tbody>
    </table>

    <!-- No.7 戻るボタン -->
    <button onclick="location.href='/admin/dashboard'">戻る</button>
</body>
</html>
