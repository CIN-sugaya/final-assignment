<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者編集</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <h1>管理者編集</h1>
    </header>
    <main>
        <form action="/admin/update" method="post">
            <div>
                <label>姓: </label>
                <input type="text" name="lastName" th:value="${admin.lastName}">
            </div>
            <div>
                <label>名: </label>
                <input type="text" name="firstName" th:value="${admin.firstName}">
            </div>
            <div>
                <label>Email: </label>
                <input type="email" name="email" th:value="${admin.email}">
            </div>
            <div>
                <label>役職: </label>
                <select name="positionId">
                    <option th:each="pos : ${positions}" th:value="${pos.id}" th:text="${pos.positionName}"
                            th:selected="${pos.id == admin.position.id}"></option>
                </select>
            </div>
            <div>
                <label>権限: </label>
                <select name="permissionId">
                    <option th:each="perm : ${permissions}" th:value="${perm.id}" th:text="${perm.permissionName}"
                            th:selected="${perm.id == admin.permission.id}"></option>
                </select>
            </div>
            <div>
                <label>電話番号: </label>
                <input type="text" name="phone" th:value="${admin.phone}">
            </div>
            <div>
                <label>パスワード: </label>
                <input type="password" name="password" th:value="${admin.password}">
            </div>
            <div>
                <button type="submit">更新</button>
                <button type="button" th:onclick="'location.href=\'/admin/admin-details?adminId=' + ${admin.id} + '\''">戻る</button>
            </div>
        </form>
    </main>
</body>
</html>
