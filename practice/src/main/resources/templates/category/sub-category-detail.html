<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中カテゴリ詳細</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <h1>中カテゴリ詳細</h1>
    </header>
    <main>
        <div>
            <label>中カテゴリ名: </label>
            <span th:text="${subCategory.subCategoryName}"></span>
        </div>
        <div>
            <h2>小カテゴリ一覧</h2>
            <ul>
                <li th:each="subSubCategory : ${subSubCategories}">
                    <span th:text="${subSubCategory.subSubCategoryName}"></span>
                    <button type="button" th:onclick="'location.href=\'/category/sub-sub-category-detail?id=' + ${subSubCategory.id} + '\''">詳細</button>
                </li>
            </ul>
        </div>
		<div>
		            <button type="button" onclick="location.href='/category/main-category-list'">戻る</button>
		        </div>
    </main>
</body>
</html>
